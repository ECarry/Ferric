name: "Release App"

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          # 1. macOS - Apple Silicon (M1/M2/M3/M4)
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'

          # 2. macOS - Intel CPU (x86_64)
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin'

          # 3. Linux
          - platform: 'ubuntu-22.04'
            args: ''

          # 4. Windows
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 1. 配置 Node.js 环境及 npm 缓存
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'

      # 2. 配置 Rust 工具链
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      # 3. Rust 编译缓存
      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      # 4. 安装 Linux 系统编译依赖 (仅 Ubuntu 必备)
      - name: Install system dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils libudev-dev

      # 5. 安装前端依赖
      - name: Install frontend dependencies
        run: npm ci

      # 6. Use the annotated tag message as the release notes.
      - name: Extract release notes and commit from tag
        id: tag-meta
        shell: bash
        run: |
          body=$(git tag -l --format='%(contents)' "${GITHUB_REF_NAME}")
          if [ -z "$body" ]; then
            echo "The tag does not contain release notes." >&2
            exit 1
          fi
          echo "commit=$(git rev-list -n 1 "${GITHUB_REF_NAME}")" >> "$GITHUB_OUTPUT"
          {
            echo "body<<EOF"
            echo "$body"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # 7. Use the Tauri v2-compatible tauri-action.

      - name: Build and Publish Tauri App
        uses: tauri-apps/tauri-action@v0.5.22
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: v__VERSION__
          releaseName: 'Ferric ${{ github.ref_name }}'
          releaseCommitish: ${{ steps.tag-meta.outputs.commit }}
          releaseBody: ${{ steps.tag-meta.outputs.body }}
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: true
          args: ${{ matrix.args }}

      # Ensure the existing release body is also corrected on reruns.
      - name: Update GitHub release notes
        uses: actions/github-script@v7
        env:
          RELEASE_BODY: ${{ steps.tag-meta.outputs.body }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const release = await github.rest.repos.getReleaseByTag({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag: context.ref.replace('refs/tags/', ''),
            });
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: release.data.id,
              body: process.env.RELEASE_BODY,
            });

  # tauri-action defaults the updater manifest "notes" to the latest commit
  # subject, so the in-app updater only shows a single line. Overwrite the
  # published latest.json "notes" with the full annotated tag message.
  update-updater-notes:
    needs: publish-tauri
    if: ${{ !cancelled() }}
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch latest.json notes with the tag message
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          body=$(git tag -l --format='%(contents)' "$TAG")
          if [ -z "$body" ]; then
            echo "The tag does not contain release notes." >&2
            exit 1
          fi
          echo "Release notes to embed:"
          echo "$body"
          mkdir -p updater-manifest
          gh release download "$TAG" --pattern latest.json --dir updater-manifest --clobber
          jq --arg notes "$body" '.notes = $notes' updater-manifest/latest.json > updater-manifest/latest.patched.json
          mv updater-manifest/latest.patched.json updater-manifest/latest.json
          echo "Patched notes:"
          jq -r '.notes' updater-manifest/latest.json

      - name: Upload patched latest.json
        uses: actions/github-script@v7
        env:
          TAG: ${{ github.ref_name }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const tag = process.env.TAG;
            const { data: release } = await github.rest.repos.getReleaseByTag({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag
            });
            const existing = release.assets.find(a => a.name === 'latest.json');
            if (existing) {
              await github.rest.repos.deleteReleaseAsset({
                owner: context.repo.owner,
                repo: context.repo.repo,
                asset_id: existing.id
              });
              console.log(`Deleted existing latest.json asset ${existing.id}`);
            }
            const data = fs.readFileSync('updater-manifest/latest.json');
            await github.rest.repos.uploadReleaseAsset({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: release.id,
              name: 'latest.json',
              data,
              headers: { 'content-type': 'application/json', 'content-length': data.length }
            });
            console.log('Uploaded patched latest.json');