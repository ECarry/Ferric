name: "Patch Updater Notes"

# Manually overwrite a published release's latest.json "notes" with the full
# annotated tag message. tauri-action defaults the updater manifest notes to
# the last commit subject, so the in-app updater otherwise shows a single line.
# This job does NOT rebuild the app; it only patches the existing manifest.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to patch (e.g. v0.1.15)"
        required: true

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch latest.json notes with the tag message
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "refs/tags/${TAG}:refs/tags/${TAG}" --force
          body=$(git tag -l --format='%(contents)' "$TAG")
          if [ -z "$body" ]; then
            echo "The tag does not contain release notes." >&2
            exit 1
          fi
          echo "Release notes to embed:"
          echo "$body"
          mkdir -p updater-manifest
          gh release download "$TAG" --pattern latest.json --dir updater-manifest --clobber
          jq --arg notes "$body" '.notes = $notes' updater-manifest/latest.json > updater-manifest/latest.patched.json
          mv updater-manifest/latest.patched.json updater-manifest/latest.json
          echo "Patched notes:"
          jq -r '.notes' updater-manifest/latest.json

      - name: Upload patched latest.json
        uses: actions/github-script@v7
        env:
          TAG: ${{ inputs.tag }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const tag = process.env.TAG;
            const { data: release } = await github.rest.repos.getReleaseByTag({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag
            });
            const existing = release.assets.find(a => a.name === 'latest.json');
            if (existing) {
              await github.rest.repos.deleteReleaseAsset({
                owner: context.repo.owner,
                repo: context.repo.repo,
                asset_id: existing.id
              });
              console.log(`Deleted existing latest.json asset ${existing.id}`);
            }
            const data = fs.readFileSync('updater-manifest/latest.json');
            await github.rest.repos.uploadReleaseAsset({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: release.id,
              name: 'latest.json',
              data,
              headers: { 'content-type': 'application/json', 'content-length': data.length }
            });
            console.log('Uploaded patched latest.json');

